name: pr-check

# PR 提交时跑版本号一致性 + 文档检查 + workspace 全量构建测试。
# 与本地 pre-push-check.sh 保持等价，确保推前和推后检查一致。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  version-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check-version.sh
        run: bash tools/check-version.sh
      - name: check-docs.sh
        run: bash tools/check-docs.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install rollup native module (Linux)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - name: Build (workspace 拓扑序)
        run: npm run build
      - name: Test (workspace 全量)
        run: npm run test

  cross-product-contract:
    # 修复十一：验证 LOOP/loop-install.sh 与主 install.sh 的跨产品调用契约不被破坏。
    # 契约（install.sh 头部「跨产品调用契约」段，v1.2.0 更新）：
    #   LOOP/loop-install.sh 第 1 步调用
    #   bash "$PROJECT_ROOT/install.sh" --base-only --platform "$PLATFORM"
    # 改动主 install.sh 的接口（入参/退出码/副作用）必须同步更新 LOOP install 脚本。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify install.sh is main installer with --base-only
        run: |
          [ -f install.sh ] || {
            echo "❌ install.sh 不存在"
            exit 1
          }
          grep -q "\-\-base-only" install.sh || {
            echo "❌ install.sh 缺少 --base-only 开关"
            exit 1
          }
          echo "✅ install.sh 主安装器 + --base-only 契约 intact"
      - name: Verify LOOP install contract
        run: |
          grep -q "install.sh" LOOP/loop-install.sh || {
            echo "❌ LOOP/loop-install.sh 未调用 install.sh，跨产品契约被破坏"
            exit 1
          }
          echo "✅ LOOP/loop-install.sh 契约 intact"
