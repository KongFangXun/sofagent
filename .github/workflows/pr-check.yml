name: pr-check

# PR 提交时跑版本号一致性 + 文档检查 + 双包构建测试。
# 与本地 pre-push-check.sh 保持等价，确保推前和推后检查一致。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  version-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check-version.sh
        run: bash tools/check-version.sh
      - name: check-docs.sh
        run: bash tools/check-docs.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install rollup native module (Linux)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - name: Build audit
        run: cd sofagent/audit && npm run build
      - name: Test audit
        run: cd sofagent/audit && npm test
      - name: Type-check mcp
        run: cd sofagent/mcp && npm run check
      - name: Build mcp
        run: cd sofagent/mcp && npm run build
      - name: Test mcp
        run: cd sofagent/mcp && npm test
