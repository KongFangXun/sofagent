name: pr-check

# PR 提交时跑版本号一致性 + 文档检查 + 守卫的守卫（门禁自身腐烂检测）+ workspace 全量构建测试。
# 与本地 pre-push-check.sh 保持等价，确保推前和推后检查一致。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  version-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: check-version.sh
        run: bash tools/check/check-version.sh
      - name: check-docs.sh
        run: bash tools/check/check-docs.sh
      # 守卫的守卫：检查门禁脚本自身的腐烂模式（BSD 不兼容正则 / CJK 标点定界 /
      # grep -c 双零地雷 / glob 未跟随目录重组导致漏扫）。静态扫只读无副作用；
      # --inject 注入实测会短暂改仓内文件，只留本地人工执行，不进 CI。
      - name: check-guards.sh
        run: bash tools/check/check-guards.sh

  # v1.3.9（四）：public API 变更检测——@public 符号集变化必须 semver bump + CHANGELOG。
  # 不装依赖直接跑（AST 引擎不可用时自动回退正则解析，门禁语义不变）。
  # v1.3.9 阶段四修复（fresh-eyes 视角11）：补 setup-node 固定 Node 22——此前吃 ubuntu 镜像
  # 预装 Node（版本漂移），且 `typescript/unstable/sync` 的可用性依赖 Node 版本；与
  # build-and-test job 及 verify.yml 的 Node 22 口径对齐（v1.2.5 crypto 教训同源）。
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: public API change detection
        run: node tools/check/public-api.mjs

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          # 缓存 ~/.npm（key 由根 package-lock.json 哈希派生，lock 变更自动失效）。
          # 不缓存 node_modules 本体：workspace 软链在 restore 后可能失效，npm ci 更可靠。
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install rollup native module (Linux)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - name: Build (workspace 拓扑序)
        run: npm run build
      - name: Test (workspace 全量)
        run: npm run test
      - name: Check test count drift
        run: npm run test:count

  cross-product-contract:
    # 验证主 install.sh 的 --base-only 契约不被破坏。
    # LOOP 已在 v1.2.0 解散为 FORGE，loop-install.sh 已移除。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify install.sh is main installer with --base-only
        run: |
          [ -f install.sh ] || {
            echo "❌ install.sh 不存在"
            exit 1
          }
          grep -q "\-\-base-only" install.sh || {
            echo "❌ install.sh 缺少 --base-only 开关"
            exit 1
          }
          echo "✅ install.sh 主安装器 + --base-only 契约 intact"
