name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bash
        run: echo "bash $(bash --version | head -1)"

      - name: Run verify.sh
        run: |
          cd sofagent-skill 2>/dev/null || true
          bash sofagent/scripts/verify.sh --json
        continue-on-error: false

      - name: Check exit code
        run: |
          bash sofagent/scripts/verify.sh --quiet || {
            echo "❌ verify.sh failed"
            exit 1
          }
          echo "✅ verify.sh passed"
