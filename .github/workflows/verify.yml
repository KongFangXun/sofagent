name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run verify.sh
        run: |
          bash sofagent/scripts/verify.sh --quiet || {
            echo "❌ verify.sh failed"
            exit 1
          }
          echo "✅ verify.sh passed"
