name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'sofagent/scripts/**/*.sh'
      - 'sofagent-lite/**/*.sh'
      - 'scripts/**/*.sh'
      - 'tools/**/*.sh'
      - 'FDE/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sofagent/scripts/**/*.sh'
      - 'sofagent-lite/**/*.sh'
      - 'scripts/**/*.sh'
      - 'tools/**/*.sh'
      - 'FDE/**/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
        env:
          # v0.99.8: SC2086/SC2155 收窄——全仓库已修复，不再全局排除
          SHELLCHECK_OPTS: -s bash -e SC2034 -e SC1090 -e SC1091
