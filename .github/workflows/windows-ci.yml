name: windows-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          rm package-lock.json -Force -ErrorAction SilentlyContinue
          rm node_modules -Recurse -Force -ErrorAction SilentlyContinue
          npm install
          npm ls @rollup/rollup-win32-x64-msvc 2>$null || npm install @rollup/rollup-win32-x64-msvc --no-save
        working-directory: sofagent/audit
      - name: Run tests
        run: npm test
        working-directory: sofagent/audit
      - name: Type check
        run: npm run check
        working-directory: sofagent/audit
      - name: Build
        run: npm run build
        working-directory: sofagent/audit
