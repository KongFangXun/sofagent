name: windows-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: sofagent/audit
      - name: Run tests
        run: npm test
        working-directory: sofagent/audit
      - name: Type check
        run: npm run check
        working-directory: sofagent/audit
      - name: Build
        run: npm run build
        working-directory: sofagent/audit
