name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sofagent/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
        # npm ci 从 macOS 生成的 lock 文件在 Linux 上可能漏装 optional native 模块
        # (https://github.com/npm/cli/issues/4828)
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp:
    needs: publish-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sofagent/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
