name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sofagent/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
        # npm ci 从 macOS 生成的 lock 文件在 Linux 上可能漏装 optional native 模块
        # (https://github.com/npm/cli/issues/4828)
      - run: npm test
      - name: Check if version already published
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sofagent/audit@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ @sofagent/audit@${VERSION} 已通过 npm 先行策略发布，CI 自动跳过 publish 步骤"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📦 @sofagent/audit@${VERSION} 未发布，CI 将执行 npm publish"
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp:
    # 不依赖 publish-audit——两个包独立发布，audit 失败不应阻塞 mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # 从根目录安装——workspace 模式让 mcp 链接到本地 @sofagent/audit
      - run: npm ci
        working-directory: .
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
        working-directory: .
      # 先 build audit——mcp 的 tsc 需要它的 .d.ts 类型声明
      - run: npm run build
        working-directory: sofagent/audit
      - run: npm run check
        working-directory: sofagent/mcp
      - run: npm run build
        working-directory: sofagent/mcp
      - name: Check if version already published
        id: version-check
        working-directory: sofagent/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sofagent/mcp@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ @sofagent/mcp@${VERSION} 已通过 npm 先行策略发布，CI 自动跳过 publish 步骤"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📦 @sofagent/mcp@${VERSION} 未发布，CI 将执行 npm publish"
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --access public
        working-directory: sofagent/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
