name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-audit:
    # v1.1.4 修复：原配置只在 engine/audit 目录跑 npm ci + npm test，
    # 但 audit 运行时依赖 @sofagent/core（workspace 链接到 ../core），
    # 而 core/dist 被 gitignore 且 CI 中无人 build core，导致 vitest 无法解析入口
    # 现改为从根目录 workspace 构建（与 publish-mcp 对齐）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # 缓存 ~/.npm（key 由根 package-lock.json 哈希派生，lock 变更自动失效）。
          # 只加速 npm ci，不影响 npm publish——发布读的是工作区产物与 lock，不是缓存。
          cache: 'npm'
      # 从根目录安装——workspace 模式让 audit 链接到本地 @sofagent/core
      - run: npm ci
        working-directory: .
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
        working-directory: .
        # npm ci 从 macOS 生成的 lock 文件在 Linux 上可能漏装 optional native 模块
        # (https://github.com/npm/cli/issues/4828)
      # workspace 拓扑序构建（含 core + audit + 其他依赖项）
      - run: npm run build
        working-directory: .
      # 在 audit 包内跑测试（此时 core/dist 已构建好）
      - run: npm test
        working-directory: engine/audit
      - name: Check if version already published
        id: version-check
        working-directory: engine/audit
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sofagent/audit@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ @sofagent/audit@${VERSION} 已通过 npm 先行策略发布，CI 自动跳过 publish 步骤"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📦 @sofagent/audit@${VERSION} 未发布，CI 将执行 npm publish"
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.skip != 'true'
        run: |
          set +e
          OUT=$(npm publish --access public 2>&1); RC=$?
          echo "$OUT"
          # 🔴 平台契约（v1.5.5 实测登记）：npm 对「版本已在 registry」的重复发布，
          #   经本渠道实测返回的是 **E404**（报错文本含 "is not in this registry"），
          #   而 **不是** E409——下方第二个豁免分支即为此而设。勿再按 409 单一假设收敛词表。
          if [ $RC -ne 0 ] && echo "$OUT" | grep -qE "E409|already published|Cannot publish over previously staged"; then
            echo "✅ 先行发布已在 registry 传播（E409 = 版本已存在）——视为已发布，跳过"
            exit 0
          fi
          # v1.5.5：E404 形态豁免——判为「已发布」前**必须二次确认**该版本确实存在于 registry，
          #   防把真实 404（包名/版本确不存在、token 无权限）误判为已发布而吞掉真失败。
          if [ $RC -ne 0 ] && echo "$OUT" | grep -q "is not in this registry"; then
            VER=$(node -p "require('./package.json').version")
            NAME=$(node -p "require('./package.json').name")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "✅ registry 二次确认 ${NAME}@${VER} 已存在——判为已发布，跳过"
              exit 0
            fi
            echo "❌ E404 且 registry 二次确认该版本不存在——真实发布失败，不豁免"
          fi
          exit $RC
        working-directory: engine/audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp:
    # 不依赖 publish-audit——两个包独立发布，audit 失败不应阻塞 mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # 缓存 ~/.npm（key 由根 package-lock.json 哈希派生，lock 变更自动失效）。
          # 只加速 npm ci，不影响 npm publish——发布读的是工作区产物与 lock，不是缓存。
          cache: 'npm'
      # 从根目录安装——workspace 模式让 mcp 链接到本地 @sofagent/audit
      - run: npm ci
        working-directory: .
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu
        working-directory: .
      # workspace 拓扑序构建（含 audit + mcp）
      - run: npm run build
        working-directory: .
      - name: Check if version already published
        id: version-check
        working-directory: engine/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sofagent/mcp@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ @sofagent/mcp@${VERSION} 已通过 npm 先行策略发布，CI 自动跳过 publish 步骤"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📦 @sofagent/mcp@${VERSION} 未发布，CI 将执行 npm publish"
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.skip != 'true'
        run: |
          set +e
          OUT=$(npm publish --access public 2>&1); RC=$?
          echo "$OUT"
          # 🔴 平台契约（v1.5.5 实测登记）：npm 对「版本已在 registry」的重复发布，
          #   经本渠道实测返回的是 **E404**（报错文本含 "is not in this registry"），
          #   而 **不是** E409——下方第二个豁免分支即为此而设。勿再按 409 单一假设收敛词表。
          if [ $RC -ne 0 ] && echo "$OUT" | grep -qE "E409|already published|Cannot publish over previously staged"; then
            echo "✅ 先行发布已在 registry 传播（E409 = 版本已存在）——视为已发布，跳过"
            exit 0
          fi
          # v1.5.5：E404 形态豁免——判为「已发布」前**必须二次确认**该版本确实存在于 registry，
          #   防把真实 404（包名/版本确不存在、token 无权限）误判为已发布而吞掉真失败。
          if [ $RC -ne 0 ] && echo "$OUT" | grep -q "is not in this registry"; then
            VER=$(node -p "require('./package.json').version")
            NAME=$(node -p "require('./package.json').name")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "✅ registry 二次确认 ${NAME}@${VER} 已存在——判为已发布，跳过"
              exit 0
            fi
            echo "❌ E404 且 registry 二次确认该版本不存在——真实发布失败，不豁免"
          fi
          exit $RC
        working-directory: engine/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
