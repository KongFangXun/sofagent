name: sofagent-audit

# 项目唯一的审计 CI 入口（原 audit.yml 已合并至此）。
# 只有 FAIL(exit 2) 才阻断 CI；WARN(exit 1) 只提醒不阻断。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build (workspace 拓扑序)
        run: npm run build
      - name: Run audit
        # exit 0=PASS / 1=WARN / 2=FAIL
        # CI 只阻断 FAIL（exit 2），WARN（exit 1）只提醒不阻断
        # 🔴 || true 防止 GitHub Actions 默认 set -e 在 npx 返回 1 时中断
        run: |
          cd engine/audit && npx sofagent-audit --silent --diff HEAD~1..HEAD --ci || true
          exit_code=$?
          if [ $exit_code -eq 2 ]; then
            echo "❌ FAIL: 审计发现违规"
            exit 1
          elif [ $exit_code -eq 1 ]; then
            echo "⚠️ WARN: 审计有警告，请确认但不阻断 CI"
            exit 0
          else
            echo "✅ PASS: 审计全通过"
          fi
