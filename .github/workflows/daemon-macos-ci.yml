name: daemon-macos-ci

on:
  push:
    paths:
      - 'engine/scripts/daemon*'
      - 'engine/scripts/lib/daemon*'
      - 'engine/scripts/verify*'
      - '.github/workflows/daemon-macos-ci.yml'
  pull_request:
    paths:
      - 'engine/scripts/daemon*'
      - 'engine/scripts/lib/daemon*'
      - 'engine/scripts/verify*'
  workflow_dispatch:

jobs:
  daemon-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install daemon
        run: bash engine/scripts/daemon-install.sh

      - name: Verify launchd plist registered
        run: |
          if [ -f ~/Library/LaunchAgents/com.sofagent.daemon.plist ]; then
            echo "launchd plist registered"
          else
            echo "launchd plist missing"
            exit 1
          fi

      - name: Unload launchd service to avoid daemon conflict
        run: |
          # macOS CI 特有：daemon-install.sh 注册的 plist 有 RunAtLoad + KeepAlive，
          # launchd 会在 load 时立即启动一个后台 daemon——该进程不继承 SOFAGENT_DATA，
          # 写到 ~/.sofagent/data/ 而非 $PWD/.sofagent/，与后续手动启动的 foreground daemon 冲突。
          # Linux CI 无此问题（systemd user service 在无 logind session 的 CI 中无法启动）。
          # 解法：验证 plist 注册成功后立即 unload，后续手动 foreground 启动（与 Linux CI 对齐）。
          launchctl unload ~/Library/LaunchAgents/com.sofagent.daemon.plist 2>/dev/null || true
          echo "launchd service unloaded for isolated foreground test"

      - name: Start daemon and wait one cycle
        run: |
          # CI 环境没有 ~/.sofagent/data，需创建本地数据目录并显式指定
          # 否则 config.sh _sofa_find_data_dir 返回空 → daemon.json 写到 /daemon.json → 权限失败
          mkdir -p .sofagent
          export SOFAGENT_DATA="${PWD}/.sofagent"
          engine/scripts/daemon.sh --foreground > .sofagent/daemon-stdout.log 2>&1 &
          DAEMON_PID=$!
          echo "started daemon foreground PID=$DAEMON_PID"
          sleep 35
          kill $DAEMON_PID 2>/dev/null || true
          wait $DAEMON_PID 2>/dev/null || true
          # 输出 daemon 日志供调试（后台进程输出不会自动出现在 CI 日志）
          if [ ! -f .sofagent/daemon.json ]; then
            echo "=== daemon stdout/stderr ==="
            cat .sofagent/daemon-stdout.log 2>/dev/null || echo "(no output)"
            echo "=== daemon.log ==="
            cat .sofagent/daemon.log 2>/dev/null || echo "(no daemon.log)"
            echo "🔴 daemon.json not found after 35s wait"
            exit 1
          fi

      - name: Verify daemon.json has required fields
        run: |
          if [ -f .sofagent/daemon.json ]; then
            echo "daemon.json exists"
            for field in pid mode detected_platforms think_hash rules_hash last_check last_evidence_score; do
              if grep -q "\"$field\"" .sofagent/daemon.json; then
                echo "  ✓ $field"
              else
                echo "  ✗ $field MISSING"
                exit 1
              fi
            done
          else
            echo "daemon.json not found"
            exit 1
          fi

      - name: Verify daemon-status.sh --json output
        run: |
          # daemon writes to $PWD/.sofagent (config.sh fallback #4)
          # config.sh line 75 reassigns SOFAGENT_DATA via _sofa_find_data_dir,
          # which checks env var first — so export must point to existing dir
          export SOFAGENT_DATA="${PWD}/.sofagent"
          # Don't let set -e kill the step if daemon-status exits non-zero
          set +e
          STATUS_JSON=$(bash engine/scripts/daemon-status.sh --json 2>&1)
          EXIT_CODE=$?
          set -e
          echo "daemon-status exit code: $EXIT_CODE"
          echo "daemon-status output:"
          echo "$STATUS_JSON"
          if [ -z "$STATUS_JSON" ]; then
            echo "⚠️ daemon-status produced no output — checking daemon.json directly"
            [ -f .sofagent/daemon.json ] && echo "daemon.json exists" || { echo "daemon.json missing"; exit 1; }
          else
            echo "$STATUS_JSON" | grep -q '"status"' && echo "JSON output valid" || { echo "JSON output invalid"; exit 1; }
          fi

      - name: Uninstall daemon
        run: |
          bash engine/scripts/daemon-uninstall.sh
          echo "daemon uninstalled"

      - name: Verify cleanup
        run: |
          if [ -f ~/Library/LaunchAgents/com.sofagent.daemon.plist ]; then
            echo "launchd plist still exists — cleanup incomplete"
            exit 1
          fi
          echo "cleanup verified"
