  <rect x="80" y="450" width="1020" height="78" rx="14" fill="#F9FAFC" stroke="#D2DAE4" stroke-width="1.5"/>
  <text x="590" y="484" text-anchor="middle" font-size="21" font-weight="600" fill="#2D3238">Agent 层（执行体 · 不替代）</text>
  <text x="590" y="510" text-anchor="middle" font-size="15" fill="#646C78">DSH · OpenClaw · WorkBuddy —— 模型 + 工具 + 会话</text>

