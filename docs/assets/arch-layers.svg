  <text x="262" y="324" text-anchor="middle" font-size="15" fill="#646C78">插件 · Skill · MCP</text>
  <text x="262" y="352" text-anchor="middle" font-size="15" fill="#646C78">CLI · Dashboard</text>

  <rect x="432" y="246" width="316" height="134" rx="10" fill="#FFFFFF" stroke="#16B8F3" stroke-width="1.5"/>
  <text x="590" y="288" text-anchor="middle" font-size="17" font-weight="600" fill="#16B8F3">约束层</text>
  <text x="590" y="324" text-anchor="middle" font-size="15" fill="#646C78">注入 · 审计</text>
  <text x="590" y="352" text-anchor="middle" font-size="15" fill="#646C78">回溯 · 进化</text>

  <rect x="760" y="246" width="316" height="134" rx="10" fill="#FFFFFF" stroke="#16B8F3" stroke-width="1.5"/>
  <text x="918" y="288" text-anchor="middle" font-size="17" font-weight="600" fill="#16B8F3">方法论</text>
  <text x="918" y="324" text-anchor="middle" font-size="15" fill="#646C78">FDE 四阶段</text>
  <text x="918" y="352" text-anchor="middle" font-size="15" fill="#646C78">梳理 → 构建 → 部署 → 离场</text>

  <!-- 箭头 2 -->
  <line x1="590" y1="400" x2="590" y2="442" stroke="#6A737D" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="604" y="426" text-anchor="start" font-size="15" fill="#6A737D">约束 Agent —— 注入 / 审计 / 回溯 / 沉淀 / 进化</text>

