<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="600" viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6A737D"/>
    </marker>
  </defs>

  <!-- Layer 1: Model layer -->
  <rect x="80" y="24" width="1020" height="102" rx="14" fill="#F9FAFC" stroke="#D2DAE4" stroke-width="1.5"/>
  <text x="590" y="66" text-anchor="middle" font-size="25" font-weight="600" fill="#2D3238">Model Layer (intelligence sources)</text>
  <text x="590" y="102" text-anchor="middle" font-size="16" fill="#646C78">General LLMs · Bespoke small / post-trained models (v1.4.x training engine · local weights)</text>

  <!-- Arrow 1 -->
  <line x1="590" y1="126" x2="590" y2="168" stroke="#6A737D" stroke-width="1.8" marker-end="url(#arre)"/>
  <text x="604" y="152" text-anchor="start" font-size="15" fill="#6A737D">Govern the model — register / rollout / train / deploy</text>

  <!-- Layer 2: Harness layer -->
  <rect x="80" y="176" width="1020" height="224" rx="14" fill="#E8F2FC" stroke="#16B8F3" stroke-width="1.8"/>
  <text x="590" y="218" text-anchor="middle" font-size="25" font-weight="600" fill="#2D3238">sofagent · FDE Harness Layer</text>

  <!-- Three capability blocks -->
  <rect x="104" y="246" width="316" height="134" rx="10" fill="#FFFFFF" stroke="#16B8F3" stroke-width="1.5"/>
  <text x="262" y="288" text-anchor="middle" font-size="17" font-weight="600" fill="#16B8F3">Form</text>
  <text x="262" y="324" text-anchor="middle" font-size="15" fill="#646C78">Plugin · Skill · MCP</text>
  <text x="262" y="352" text-anchor="middle" font-size="15" fill="#646C78">CLI · Dashboard</text>

  <rect x="432" y="246" width="316" height="134" rx="10" fill="#FFFFFF" stroke="#16B8F3" stroke-width="1.5"/>
  <text x="590" y="288" text-anchor="middle" font-size="17" font-weight="600" fill="#16B8F3">Constraint Layer</text>
  <text x="590" y="324" text-anchor="middle" font-size="15" fill="#646C78">Inject · Audit</text>
  <text x="590" y="352" text-anchor="middle" font-size="15" fill="#646C78">Rollback · Evolve</text>

  <rect x="760" y="246" width="316" height="134" rx="10" fill="#FFFFFF" stroke="#16B8F3" stroke-width="1.5"/>
  <text x="918" y="288" text-anchor="middle" font-size="17" font-weight="600" fill="#16B8F3">Methodology</text>
  <text x="918" y="324" text-anchor="middle" font-size="15" fill="#646C78">FDE four phases</text>
  <text x="918" y="352" text-anchor="middle" font-size="15" fill="#646C78">Map → Build → Deploy → Depart</text>

  <!-- Arrow 2 -->
  <line x1="590" y1="400" x2="590" y2="442" stroke="#6A737D" stroke-width="1.8" marker-end="url(#arre)"/>
  <text x="604" y="426" text-anchor="start" font-size="15" fill="#6A737D">Constrain the Agent — inject / audit / rollback / distill / evolve</text>

  <!-- Layer 3: Agent layer -->
  <rect x="80" y="450" width="1020" height="78" rx="14" fill="#F9FAFC" stroke="#D2DAE4" stroke-width="1.5"/>
  <text x="590" y="484" text-anchor="middle" font-size="21" font-weight="600" fill="#2D3238">Agent Layer (executors · not replaced)</text>
  <text x="590" y="510" text-anchor="middle" font-size="15" fill="#646C78">DSH · OpenClaw · WorkBuddy — model + tools + sessions</text>

  <!-- Bottom delivery row -->
  <rect x="80" y="544" width="1020" height="44" rx="10" fill="#FFFFFF" stroke="#D2DAE4" stroke-width="1.5"/>
  <text x="590" y="572" text-anchor="middle" font-size="16" fill="#646C78">Dual-graph delivery — business graph + ontology graph → AI nodes (host executes · Harness audits · 7x24)</text>
</svg>
