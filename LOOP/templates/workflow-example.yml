# Workflow 示例模板
# ============================================
# 这是 sofagent LOOP 消费的标准 workflow 格式。
# 编排层（WorkBuddy 等）产出任务列表 → 写成此格式 → LOOP 自动执行。
#
# 字段说明：
#   id         — 子任务唯一标识
#   task       — 子任务描述（engineer 的输入）
#   depends_on — 依赖的前置子任务 ID（可选）
#   agent      — 指定 Sub Agent（可选，默认 engineer）
# ============================================

workflow:
  name: "示例：新增审计规则 A20"
  description: "在 audit 包中新增一条供应链安全检查规则"

  nodes:
    - id: T1
      task: "在 sofagent/audit/src/rules/ 下新建 rule-a20-supply-chain.ts，定义 checkRuleA20 函数。规则检测 package-lock.json 中的非预期依赖变更（新增/删除/版本跳变）。ruleClass='业务底线'，evidenceMode='git-diff'。"
      depends_on: []

    - id: T2
      task: "在 sofagent/audit/src/rules/index.ts 中注册 A20 规则：import checkRuleA20 → 添加到 extendedRules 数组末尾。"
      depends_on: [T1]

    - id: T3
      task: "在 sofagent/audit/src/rules/runner.ts 的 AUDIT_PRIORITY.extended 中，在 A19 之后插入 A20。"
      depends_on: [T2]

    - id: T4
      task: "在 sofagent/audit/src/rules/__tests__/ 下新建 rule-a20-supply-chain.test.ts，写 5 个测试用例：①新增未声明依赖→WARN ②删除依赖→WARN ③版本跳变(+2)→WARN ④正常更新→PASS ⑤无变更→PASS。"
      depends_on: [T1]

    - id: T5
      task: "运行 npm run build && npm test，确认全量测试通过（含新增 A20 的 5 个用例）。"
      depends_on: [T3, T4]
