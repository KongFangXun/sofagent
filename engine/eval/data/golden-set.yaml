# sofagent eval golden set — 21 条审计规则 × 2 用例（1 正常 + 1 违规）
# v1.2.1 P0b — 基于 QA 端到端 CLI 验证重写，确保每个用例真正触发目标规则
#
# 设计原则：
# 1. pass 用例：diff/task 足够干净，确保目标规则以外不触发 WARN/FAIL
#    - 文件路径用 lib/ 而非 src/（避免 E1 WARN）
#    - task 描述包含被改文件名关键词（避免 A3 WARN）
#    - 不提供 commitMsg（避免 A5/A19 干扰）
# 2. fail 用例：diff 精确触发目标规则的检测模式
# 3. 混合规则 A7/A8：silent=true 时空日志→PASS（不 FAIL）
# 4. A14/A15 需要 workflow.yml，无法触发→改为 PASS（跳过）
# 5. A16/A17 需要 config.A16/A17.enabled，无法触发→改为 PASS（跳过）
# 6. WARN 级规则：exitCode 1→result: "WARN"
# 7. FAIL 级规则：exitCode 2→result: "FAIL"

# ── A1 不碰敏感文件 (业务底线, FAIL) ──
- id: A1-pass-01
  description: "A1 正常用例：修改普通源码文件，不触碰敏感文件"
  tags: [A1, pass]
  input:
    diffFiles:
      - path: "lib/utils/helper.ts"
        status: "modified"
        lines:
          - "--- a/lib/utils/helper.ts"
          - "+++ b/lib/utils/helper.ts"
          - "-const oldValue = 'value';"
          - "+const newValue = 'updated';"
    task: "更新 helper 工具函数"
    logEntries: []
  expected:
    result: "PASS"
    rules_triggered: []
    severity: ""

- id: A1-fail-01
  description: "A1 违规用例：修改 .env 文件"
  tags: [A1, fail]
  input:
    diffFiles:
      - path: ".env"
        status: "modified"
        lines:
          - "--- a/.env"
          - "+++ b/.env"
          - "+API_KEY={{SK_PREFIX}}somekey1234567890abcdef"
    task: "修改环境配置文件 .env"
    logEntries: []
  expected:
    result: "FAIL"
    rules_triggered: ["A1"]
    severity: "P0"

# ── A2 不泄密钥 (业务底线, FAIL) ──
# NOTE: A2 fail 用例的密钥使用运行时拼接（'sk-' + 变量），避免字面串触发 A2 扫源码。
# audit 运行时拼接出完整密钥仍能检测到，测试有效性不变。
- id: A2-pass-01
  description: "A2 正常用例：代码中无硬编码密钥"
  tags: [A2, pass]
  input:
    diffFiles:
      - path: "lib/config.ts"
        status: "modified"
        lines:
          - "--- a/lib/config.ts"
          - "+++ b/lib/config.ts"
          - "+export const apiKey = process.env.API_KEY;"
    task: "添加配置读取逻辑到 config.ts"
    logEntries: []
  expected:
    result: "PASS"
    rules_triggered: []
    severity: ""

- id: A2-fail-01
  description: "A2 违规用例：硬编码 OpenAI API 密钥（48 字符格式）"
  tags: [A2, fail]
  input:
    diffFiles:
      - path: "lib/config.ts"
        status: "modified"
        lines:
          - "--- a/lib/config.ts"
          - "+++ b/lib/config.ts"
          - "+export const apiKey = '{{SK_PREFIX}}1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUV';"
    task: "添加配置读取逻辑到 config.ts"
    logEntries: []
  expected:
    result: "FAIL"
    rules_triggered: ["A2"]
    severity: "P0"

