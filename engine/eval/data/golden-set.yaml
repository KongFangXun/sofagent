# ── A7 不存盲改 (能力拐杖, WARN) ──
# A7 是 hybrid 规则：silent=true + 无日志 → PASS（跳过检查）
# 有日志但无读取记录 → FAIL（能力拐杖 FAIL 被 runner 降级为 exitCode 1 → WARN）
- id: A7-pass-01
  description: "A7 正常用例：silent 模式下跳过检查"
  tags: [A7, pass]
  input:
    diffFiles:
      - path: "lib/utils/helper.ts"
        status: "modified"
        lines:
          - "--- a/lib/utils/helper.ts"
          - "+++ b/lib/utils/helper.ts"
          - "-const oldValue = 'value';"
          - "+const newValue = 'updated';"
    task: "更新 lib/utils/helper.ts helper 函数"
    logEntries: []
  expected:
    result: "PASS"
    rules_triggered: []
    severity: ""

- id: A7-fail-01
  description: "A7 违规用例：有日志但修改文件无读取记录"
  tags: [A7, fail]
  input:
    diffFiles:
      - path: "lib/utils/helper.ts"
        status: "modified"
        lines:
          - "--- a/lib/utils/helper.ts"
          - "+++ b/lib/utils/helper.ts"
          - "-const oldValue = 'value';"
          - "+const newValue = 'updated';"
    task: "更新 lib/utils/helper.ts helper 函数"
    logEntries:
      - timestamp: "2025-07-01T10:00:00Z"
        operation: "execute"
        raw: "npm test"
    commitMsg: "feat: 更新 helper 返回值"
  expected:
    result: "WARN"
    rules_triggered: ["A7"]
    severity: "P1"

