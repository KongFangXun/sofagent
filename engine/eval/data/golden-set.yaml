- id: A8-fail-01
  description: "A8 违规用例：构建文件变更后有日志但无测试执行"
  tags: [A8, fail]
  input:
    diffFiles:
      - path: "lib/utils/helper.ts"
        status: "modified"
        lines:
          - "--- a/lib/utils/helper.ts"
          - "+++ b/lib/utils/helper.ts"
          - "+const newValue = 'updated';"
      - path: "package.json"
        status: "modified"
        lines:
          - "--- a/package.json"
          - "+++ b/package.json"
          - '+    "lodash": "^4.17.21"'
    task: "更新 lib/utils/helper.ts 并修改 package.json"
    logEntries:
      - timestamp: "2025-07-01T10:00:00Z"
        operation: "read"
        raw: "读取 lib/utils/helper.ts"
        file: "lib/utils/helper.ts"
      - timestamp: "2025-07-01T10:01:00Z"
        operation: "read"
        raw: "读取 package.json"
        file: "package.json"
      - timestamp: "2025-07-01T10:02:00Z"
        operation: "write"
        raw: "写入 lib/utils/helper.ts"
        file: "lib/utils/helper.ts"
      - timestamp: "2025-07-01T10:03:00Z"
        operation: "write"
        raw: "写入 package.json"
        file: "package.json"
    commitMsg: "feat: 添加 lodash 依赖并更新 helper"
  expected:
    result: "WARN"
    rules_triggered: ["A8"]
    severity: "P1"

