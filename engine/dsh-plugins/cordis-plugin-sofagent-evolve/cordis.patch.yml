# sofagent cordis-plugin-sofagent-evolve bundle patch v1.5.8——注册为 DSH profile layer
- insert:
    - id: sofagent-evolve
      name: 'cordis-plugin-sofagent-evolve'
      inject: [settings, dynamicCordisRunner]
      config:
        seam: "session/event + fs/write-intent"    # 语义：会话事件流中的 Turn 结束（turn/end）→ 经验沉淀（think.md 反思） + 文件写入意图拦截（写面窄化：模型只写 memory / skill，控制面写入即拒）
        description: "进化面 RSI 独立模块——准入门/晋级/经验池/考核/写面审计/能力基线/透明仓；运行载体 = RSI 插件，沉淀留主干、审计链不受插件存废影响——桥接 @sofagent/think generateThinkEntry / @sofagent/core parseDiff / @sofagent/audit runRules / @sofagent/core getDataDir"
