# sofagent cordis-plugin-sofagent-evolve bundle patch v1.5.0——注册为 DSH profile layer
- insert:
    - id: sofagent-evolve
      name: 'cordis-plugin-sofagent-evolve'
      inject: [settings, dynamicCordisRunner]
      config:
        seam: "session/event"    # 语义：会话事件流中的 Turn 结束（turn/end）→ 经验沉淀（think.md 反思）
