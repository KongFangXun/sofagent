# sofagent cordis-plugin-sofagent-gate bundle patch v1.4.8——注册为 DSH profile layer
- insert:
    - id: sofagent-gate
      name: 'cordis-plugin-sofagent-gate'
      inject: [settings, dynamicCordisRunner]
      config:
        seam: "agent/turn-stopping"    # 语义：Turn 结束前停止条件判定——验收不过不放行
        description: "给宿主加上验收门禁——Agent 想收尾先过机器判定，不过不放行——桥接 @sofagent/audit runRules"
