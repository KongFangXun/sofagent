# sofagent cordis-plugin-sofagent-rollback bundle patch v1.5.3——注册为 DSH profile layer
- insert:
    - id: sofagent-rollback
      name: 'cordis-plugin-sofagent-rollback'
      inject: [settings, dynamicCordisRunner]
      config:
        seam: "agent/error"    # 语义：Agent 出错 → git snapshot 逆序撤销（默认关档，需显式开 rollbackOnError）
        description: "给宿主加上快照回溯——Agent 出错时按 git 快照逆序撤销本次改动——桥接 @sofagent/core restoreSnapshot / @sofagent/core listSnapshots"
