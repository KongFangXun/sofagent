# sofagent cordis-plugin-sofagent-rollback bundle patch v1.4.8——注册为 DSH profile layer
- insert:
    - id: sofagent-rollback
      name: 'cordis-plugin-sofagent-rollback'
      inject: [settings, dynamicCordisRunner]
      config:
        seam: "agent/error"    # 语义：Agent 出错 → git snapshot 逆序撤销
        description: "出错逆序撤销——git snapshot → effect disposer——桥接 @sofagent/core getHistoryFilePath"
