name: 'sofagent-audit'
description: 'AI Agent 行为审计——每次 PR 自动检查。sofagent 审计引擎 24 条规则，零 token 纯 git diff 扫描，结果直接显示在 PR diff 行上。'
author: 'KongFangXun'
branding:
  icon: 'shield'
  color: 'blue'
# ⚠️ 发版同步提醒：版本锁定在下方 run 块的 npx 命令。
# 每次发版必须同步更新此版本号 + package.json version + CHANGELOG，三者保持一致。
inputs:
  ruleset:
    description: '规则集名称（sofagent / security / 社区包名）'
    required: false
    default: 'sofagent'
  diff-range:
    description: '审计的 diff 范围（默认 origin/main..HEAD）'
    required: false
    default: 'origin/main..HEAD'
  strict:
    description: '严格模式（无日志时 WARN 升级为 FAIL）'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Run sofagent audit
      shell: bash
      run: |
        # ⚠️ 版本锁定：npx -p 的包名固定到具体版本（下方 1.3.8），避免上游 patch 引入行为变更。
        # 发版时同步更新此版本号（与 package.json version + CHANGELOG 对齐）。
        npx -y -p @sofagent/audit@1.4.1 sofagent-audit-full \
          --diff "${{ inputs.diff-range }}" \
          --ruleset "${{ inputs.ruleset }}" \
          ${{ inputs.strict == 'true' && '--strict' || '' }} \
          --ci
      env:
        GITHUB_TOKEN: ${{ github.token }}
