name: 'sofagent'
description: 'Audit AI agent commits on every PR — 24 rules, zero tokens, inline results. AI 行为审计'
author: 'KongFangXun'
branding:
  icon: 'shield'
  color: 'blue'
# ⚠️ 发版同步提醒：版本锁定在下方 run 块的 npx 命令。
# 每次发版必须同步更新此版本号 + package.json version + CHANGELOG，三者保持一致。
inputs:
  ruleset:
    description: 'Ruleset name (sofagent / security / community package). 规则集名称'
    required: false
    default: 'sofagent'
  diff-range:
    description: 'Diff range to audit, e.g. origin/main..HEAD. 审计的 diff 范围'
    required: false
    default: 'origin/main..HEAD'
  strict:
    description: 'Strict mode: WARN escalates to FAIL when no logs exist. 严格模式'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Run sofagent audit
      shell: bash
      run: |
        # ⚠️ 版本锁定：npx -p 的包名固定到具体版本（下方版本号见下行 npx 命令），避免上游 patch 引入行为变更。
        # 发版时同步更新此版本号（与 package.json version + CHANGELOG 对齐）。
        npx -y -p @sofagent/audit@1.4.2 sofagent-audit-full \
          --diff "${{ inputs.diff-range }}" \
          --ruleset "${{ inputs.ruleset }}" \
          ${{ inputs.strict == 'true' && '--strict' || '' }} \
          --ci
      env:
        GITHUB_TOKEN: ${{ github.token }}
